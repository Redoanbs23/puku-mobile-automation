name: CI

# Stage 1 of the two-stage pipeline per the CI/CD readiness analysis
# and ADR-007 (docs/adr/ADR-007-ci-pre-authenticated-snapshot-strategy.md).
# Stage 2 (the pre-authenticated snapshot suite) lives in the separate
# workflow file ci-authenticated.yml, deliberately split out rather
# than run as a second job here — see that file's header comment for
# why the split matters.
#
# This workflow runs on every push and pull_request, including from
# forks. It DOES use a secret — APP_REPO_READ_TOKEN, read-only access
# to the private app repo, needed by the APK-fetch step below. That's
# still safe on fork-triggered pull_request runs specifically because
# of GitHub's default behavior of withholding repository/environment
# secrets from those runs: a fork PR's run simply fails at the
# APK-fetch step (no token available to it), not silently leaks one.
#
# Per ADR-007 control #4, changes to this file require CODEOWNERS
# review.

on:
  push:
  pull_request:
  workflow_dispatch:

# Least-privilege default; jobs opt into anything more.
permissions:
  contents: read

jobs:
  emulator-safe:
    name: Lint, typecheck, and LOGIN-E2E-002 (vanilla emulator)
    runs-on: ubuntu-latest
    # Switched from macos-latest to ubuntu-latest + explicit KVM enablement
    # (the "Enable KVM group perms" step below, the standard pattern from
    # reactivecircus/android-emulator-runner's own docs) — cheaper and
    # faster per-minute than macOS, and KVM enablement on GitHub-hosted
    # Ubuntu runners is a known-stable pattern, not the variable risk the
    # prior comment here assumed. arch: x86_64 on the emulator step below
    # matches this runner's actual host architecture (Ubuntu GitHub
    # runners are x86_64, unlike macos-latest's Apple Silicon hosts).
    steps:
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Matches package.json's "engines": { "node": ">=24" } — the
          # project's actual toolchain (nvm, set up at project start).
          # Note @types/node's "^22.0.0" is a type-definitions version,
          # not the runtime version; don't infer Node version from it.
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Appium UiAutomator2 driver
        # The prior "check installed state first, then conditionally
        # install" approach didn't reliably detect the already-installed
        # case (npx/CLI output didn't match the expected grep pattern) and
        # still failed the job. Simplified: `|| true` means "treat this
        # step as successful regardless of this command's exit code" —
        # accepted here on the assumption that the dominant failure mode
        # is "already installed" (harmless), not a real error worth
        # catching. That assumption is NOT verified — a genuine failure
        # (network/registry issue, incompatible version, disk space) would
        # also be silently swallowed by this and only surface later, more
        # confusingly, at test-run time. Revisit if driver-related test
        # failures ever show up without an obvious cause.
        run: npx appium driver install uiautomator2 || true

      # PUKU's APK is gitignored (apk/, *.apk) and pulled from the latest
      # release on the app's own (separate, private) repo. Same
      # APP_REPO_READ_TOKEN secret as ci-on-app-release.yml — read access
      # to that repo only, distinct from AUTOMATION_DISPATCH_TOKEN (see
      # that file's header comment).
      - name: Fetch latest PUKU release metadata
        id: latest_release
        env:
          APP_REPO_READ_TOKEN: ${{ secrets.APP_REPO_READ_TOKEN }}
        run: |
          RELEASE_JSON=$(curl -sSfL \
            -H "Authorization: Bearer $APP_REPO_READ_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/puku-app/puku-app-flutter/releases/latest")

          # The asset's "url" field is the authenticated API download
          # endpoint (works with Accept: application/octet-stream below).
          # Deliberately not "browser_download_url" — on a private repo
          # that only resolves through a browser session, not curl+token.
          ASSET_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name == "app-dev-release.apk") | .url')

          if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" == "null" ]; then
            echo "::error::No asset named 'app-dev-release.apk' found on the latest release of puku-app/puku-app-flutter. Refusing to continue — check that the release includes that asset."
            exit 1
          fi

          echo "asset_url=$ASSET_URL" >> "$GITHUB_OUTPUT"

      - name: Download PUKU APK from latest release
        env:
          APK_ASSET_URL: ${{ steps.latest_release.outputs.asset_url }}
          APP_REPO_READ_TOKEN: ${{ secrets.APP_REPO_READ_TOKEN }}
        run: |
          # Refuse to send the token anywhere but the expected app repo's
          # release-assets API endpoint, regardless of what the prior step
          # produced — same defensive bound as ci-on-app-release.yml's
          # apk_url prefix check.
          EXPECTED_PREFIX="https://api.github.com/repos/puku-app/puku-app-flutter/releases/assets/"
          case "$APK_ASSET_URL" in
            "$EXPECTED_PREFIX"*) ;;
            *)
              echo "::error::asset url ('$APK_ASSET_URL') does not match the expected prefix ($EXPECTED_PREFIX) — refusing to send credentials to an unexpected host."
              exit 1
              ;;
          esac

          mkdir -p apk
          # Path matches config/environments/local.ts's DEFAULT_APK_PATH
          # (apk/puku.apk, relative to repo root / process.cwd()) — no
          # PUKU_APK_PATH override needed as long as the file lands here.
          curl -sSfL \
            -H "Authorization: Bearer $APP_REPO_READ_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$APK_ASSET_URL" \
            -o apk/puku.apk

      # TEMPORARY DIAGNOSTIC — not a fix. Answers one question: does
      # app-dev-release.apk actually install under package `sh.puku.app`,
      # the value hardcoded in config/wdio.android.conf.ts's
      # appium:appPackage? Local exploration all day confirmed sh.puku.app
      # only against app-prod-release.apk — a different build variant —
      # so that assumption is unverified for the dev release CI fetches.
      # No explicit Android SDK install step exists anywhere in this
      # workflow (checked: no sdkmanager/ANDROID_HOME/build-tools
      # references in ci.yml, ci-on-app-release.yml, or
      # ci-authenticated.yml) — whatever's here comes from ubuntu-latest's
      # runner image, not anything this job sets up. The exact build-tools
      # version bundled there isn't knowable ahead of time from outside a
      # live run, so this resolves the highest installed version at
      # runtime rather than hardcoding a guess that could silently go
      # stale on a runner-image update. Remove this step once the real
      # package name is known and appium:appPackage is fixed accordingly.
      - name: DIAGNOSTIC - dump APK package name via aapt
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            echo "::error::ANDROID_HOME is not set in this environment — cannot locate aapt. This itself is a finding worth recording."
            exit 1
          fi

          AAPT_PATH=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name aapt -type f 2>/dev/null | sort -V | tail -1)

          if [ -z "$AAPT_PATH" ]; then
            echo "::error::No aapt binary found under \$ANDROID_HOME/build-tools ($ANDROID_HOME/build-tools). Installed build-tools versions:"
            ls -1 "$ANDROID_HOME/build-tools" 2>&1 || echo "(build-tools directory does not exist)"
            exit 1
          fi

          echo "Using aapt at: $AAPT_PATH"
          "$AAPT_PATH" dump badging apk/puku.apk | grep package

      - name: Run LOGIN-E2E-002 against a vanilla emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          avd-name: Pixel_7
          # Vanilla AVD — deliberately not the pre-authenticated snapshot.
          # LOGIN-E2E-002 has no login dependency (see the CI/CD readiness
          # analysis), so a fresh, unauthenticated emulator is correct here.
          # avd-name matches config/environments/local.ts's deviceName
          # default ('Pixel_7'), which config/wdio.android.conf.ts feeds
          # into appium:avd — no DEVICE_NAME override needed in CI.
          script: npm test -- --mochaOpts.grep="LOGIN-E2E-002"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-safe-results
          path: |
            test-results/junit/**
            allure-results/**
          if-no-files-found: warn
