name: CI

# Stage 1 of the two-stage pipeline per the CI/CD readiness analysis
# and ADR-007 (docs/adr/ADR-007-ci-pre-authenticated-snapshot-strategy.md).
# Stage 2 (the pre-authenticated snapshot suite) lives in the separate
# workflow file ci-authenticated.yml, deliberately split out rather
# than run as a second job here — see that file's header comment for
# why the split matters.
#
# static-checks runs on every push/PR with no secrets. emulator-smoke is
# opt-in via the ENABLE_EMULATOR_CI repository variable — set it to "true"
# once PUKU_APK_URL (and optionally APP_REPO_READ_TOKEN) secrets exist.
# Until then, CI passes on lint + typecheck alone; see ci-on-app-release.yml
# for the release-triggered APK path.
#
# Per ADR-007 control #4, changes to this file require CODEOWNERS review.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

  emulator-smoke:
    name: LOGIN-E2E-002 (vanilla emulator)
    needs: static-checks
    if: vars.ENABLE_EMULATOR_CI == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Appium UiAutomator2 driver
        run: npx appium driver install uiautomator2 || true

      - name: Download PUKU APK
        env:
          APK_URL: ${{ secrets.PUKU_APK_URL }}
          APP_REPO_READ_TOKEN: ${{ secrets.APP_REPO_READ_TOKEN }}
        run: |
          if [ -z "$APK_URL" ]; then
            echo "::error::ENABLE_EMULATOR_CI is true but PUKU_APK_URL secret is not set."
            exit 1
          fi

          mkdir -p apk

          if [ -n "$APP_REPO_READ_TOKEN" ]; then
            curl -sSfL \
              -H "Authorization: Bearer $APP_REPO_READ_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$APK_URL" \
              -o apk/puku.apk
          else
            curl -sSfL "$APK_URL" -o apk/puku.apk
          fi

          if [ ! -s apk/puku.apk ]; then
            echo "::error::Downloaded APK is missing or empty at apk/puku.apk"
            exit 1
          fi

          echo "APK ready at apk/puku.apk ($(wc -c < apk/puku.apk) bytes)"

      - name: Run LOGIN-E2E-002 against a vanilla emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          script: npm test -- --mochaOpts.grep="LOGIN-E2E-002"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-smoke-results
          path: |
            test-results/junit/**
            allure-results/**
          if-no-files-found: warn
